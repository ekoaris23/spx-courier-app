<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap SPX - System Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- LOGIN SECTION -->
  <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
      <h2 class="text-2xl font-bold text-center text-orange-600 mb-6">Login Rekap SPX</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Pilih Role Akses</label>
          <select id="login-role" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            <option value="leader">Leader (Koordinator)</option>
            <option value="assistant">Asisten Monitor</option>
            <option value="admin">Owner / Admin</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="login-password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" placeholder="Masukkan password...">
        </div>
        <button type="submit" class="w-full bg-orange-600 text-white p-2 rounded-md font-semibold hover:bg-orange-700">Masuk</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP SECTION -->
  <div id="app-section" class="hidden min-h-screen pb-12">
    <!-- Navbar -->
    <nav class="bg-orange-600 text-white p-4 flex justify-between items-center shadow-md">
      <div>
        <h1 class="text-xl font-bold">Rekap SPX Mitra</h1>
        <p id="user-role-badge" class="text-xs bg-orange-800 px-2 py-0.5 rounded inline-block mt-1 uppercase font-semibold"></p>
      </div>
      <button id="logout-btn" class="bg-red-500 text-xs px-3 py-2 rounded hover:bg-red-600 font-semibold">Logout</button>
    </nav>

    <div class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- FORM INPUT DATA -->
      <div class="bg-white p-6 rounded-xl shadow md:col-span-1">
        <h3 class="text-lg font-bold mb-4 text-gray-700 border-b pb-2">Input Pengiriman Harian</h3>
        <form id="entry-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600">Tanggal</label>
            <input type="date" id="entry-date" required class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600">Pilih Kurir</label>
            <select id="entry-courier" required class="w-full border rounded p-2 text-sm">
              <option value="Kurir A">Kurir A</option>
              <option value="Kurir B">Kurir B</option>
              <option value="Kurir C">Kurir C</option>
            </select>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs text-gray-600">Standar (2.5k)</label>
              <input type="number" id="pkg-standard" value="0" min="0" class="w-full border rounded p-2 text-sm">
            </div>
            <div>
              <label class="block text-xs text-gray-600">Jauh (2.8k)</label>
              <input type="number" id="pkg-far" value="0" min="0" class="w-full border rounded p-2 text-sm">
            </div>
            <div>
              <label class="block text-xs text-gray-600">Berat (3k)</label>
              <input type="number" id="pkg-heavy" value="0" min="0" class="w-full border rounded p-2 text-sm">
            </div>
          </div>
          <button type="submit" class="w-full bg-green-600 text-white py-2 rounded font-semibold text-sm hover:bg-green-700">Simpan Rekap Data</button>
        </form>
      </div>

      <!-- DASHBOARD CARDS & CHARTS -->
      <div class="md:col-span-2 space-y-6">

        <!-- METRIC CARDS -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4" id="metrics-container">
          <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
            <p class="text-xs text-gray-500">Total Paket</p>
            <h4 id="metric-total-pkg" class="text-xl font-bold">0</h4>
          </div>
          <div class="bg-white p-4 rounded-xl shadow border-l-4 border-yellow-500">
            <p class="text-xs text-gray-500">Omset Leader (4k)</p>
            <h4 id="metric-leader-omset" class="text-lg font-bold">Rp 0</h4>
          </div>
          <div class="bg-white p-4 rounded-xl shadow border-l-4 border-purple-500">
            <p class="text-xs text-gray-500">Komisi Asisten (1%)</p>
            <h4 id="metric-assistant-fee" class="text-lg font-bold">Rp 0</h4>
          </div>
          <!-- Owner Only Card -->
          <div id="admin-card-profit" class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500 hidden">
            <p class="text-xs text-gray-500">Profit Owner (1.3k)</p>
            <h4 id="metric-owner-profit" class="text-lg font-bold text-green-600">Rp 0</h4>
          </div>
        </div>

        <!-- CHARTS -->
        <div class="bg-white p-6 rounded-xl shadow">
          <h3 class="text-md font-bold mb-4 text-gray-700">Analisis Tren Paket Harian</h3>
          <canvas id="volumeChart" class="w-full max-h-64"></canvas>
        </div>

        <!-- TABLE DATA REKAP -->
        <div class="bg-white p-6 rounded-xl shadow overflow-x-auto">
          <h3 class="text-md font-bold mb-4 text-gray-700">Riwayat Pengiriman Kurir</h3>
          <table class="w-full text-left text-sm border-collapse">
            <thead>
              <tr class="bg-gray-100 border-b text-xs text-gray-600 uppercase">
                <th class="p-2">Tgl</th>
                <th class="p-2">Kurir</th>
                <th class="p-2">Std / Jauh / Berat</th>
                <th class="p-2">Hak Kurir</th>
                <th class="p-2">Aksi</th>
              </tr>
            </thead>
            <tbody id="recap-table-body">
              <!-- Auto filled by JS -->
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
